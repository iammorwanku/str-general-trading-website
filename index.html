<style>
:root{--navy:#061b3f;--navy2:#0b2f66;--navy3:#12396f;--gold:#e0a417;--gold-l:#f6cf63;--gold-d:#a86f10;--ink:#0b1626;--mute:#56667a;--concrete:#eceff2;--line:#d3d9e0;--white:#fff;--wa:#1fa855;
--gradg:linear-gradient(120deg,#b97b0d 0%,#eeb21d 40%,#fbd870 58%,#d19215 100%);
--haz:repeating-linear-gradient(-45deg,#e0a417 0 18px,#061b3f 18px 36px);
--grid:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
--cond:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--sans:"Barlow","Segoe UI",Arial,sans-serif}
*{box-sizing:border-box;margin:0;border-radius:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{font:400 1.05rem/1.7 var(--sans);color:var(--ink);background:var(--white);-webkit-font-smoothing:antialiased}
img,svg{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
h1,h2,h3{font-family:var(--cond);font-weight:800;line-height:1;text-transform:uppercase;letter-spacing:.015em;color:var(--navy)}
.wrap{width:min(1200px,100% - 44px);margin-inline:auto}
section{padding:100px 0}
h2{font-size:clamp(2.4rem,5vw,3.8rem);margin-bottom:18px;padding-left:20px;border-left:10px solid var(--gold)}
.center h2{display:inline-block;text-align:left}
.lead{max-width:60ch;color:var(--mute);font-size:1.1rem}
.center .lead{margin-inline:auto}
.btn{display:inline-block;font:700 1.15rem var(--cond);letter-spacing:.07em;text-transform:uppercase;padding:15px 34px;text-decoration:none;border:2px solid var(--gold);background:var(--gold);color:var(--navy);cursor:pointer;transition:background .2s,color .2s}
.btn:hover{background:var(--navy);color:var(--gold);border-color:var(--navy)}
.hero .btn:hover{background:transparent;color:var(--gold-l);border-color:var(--gold)}
.btn.ghost{background:transparent;color:var(--white);border-color:rgba(255,255,255,.6)}
.hero .btn.ghost:hover{background:var(--white);color:var(--navy);border-color:var(--white)}
.top{background:var(--ink);color:#b9c6d8;font-size:.88rem}
.top .wrap{display:flex;justify-content:space-between;gap:20px;align-items:center;min-height:40px;flex-wrap:wrap}
.top a{text-decoration:none;color:var(--white);font-weight:500;margin-left:24px}
.top a:hover{color:var(--gold-l)}
.top b{color:var(--gold-l);font-weight:600}
header{position:sticky;top:0;z-index:50;background:var(--white);box-shadow:0 2px 0 var(--gold)}
.bar{display:flex;align-items:center;justify-content:space-between;height:82px}
.logo img{height:66px;width:auto}
nav ul{display:flex;gap:30px;list-style:none;padding:0;align-items:center}
nav a{text-decoration:none;font:700 1.1rem var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--navy);transition:color .2s}
nav a:hover{color:var(--gold-d)}
nav .btn{padding:10px 22px;font-size:1.05rem}
nav .btn:hover{color:var(--gold)}
.menu{display:none;background:var(--navy);border:0;color:var(--white);padding:10px 18px;font:700 1rem var(--cond);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.hero{background:var(--grid),linear-gradient(160deg,var(--navy3) 0%,var(--navy) 60%);background-size:56px 56px,56px 56px,auto;color:var(--white);padding:110px 0 190px;position:relative;overflow:hidden}
.hero .wrap{position:relative;z-index:2;display:grid;grid-template-columns:1.15fr .85fr;gap:60px;align-items:center}
.hero h1{color:var(--white);font-size:clamp(2.5rem,5.2vw,4.3rem);margin-bottom:20px;line-height:1.02}
.hero .tag{font:700 1.45rem/1.2 var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-bottom:22px;display:inline-block;border-top:3px solid var(--gold);padding-top:14px}
.hero p.lead{color:#c5d2e4;margin-bottom:38px}
.cta{display:flex;gap:16px;flex-wrap:wrap}
.sky{position:absolute;left:0;right:0;bottom:0;width:100%;height:170px;z-index:1}
.plate{position:relative;background:var(--white);padding:30px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.plate img{width:100%;height:auto}
.plate i{position:absolute;width:34px;height:34px;border:6px solid var(--gold)}
.plate i:nth-child(1){left:-12px;top:-12px;border-right:0;border-bottom:0}
.plate i:nth-child(2){right:-12px;bottom:-12px;border-left:0;border-top:0}
.haz{height:22px;background:var(--haz)}
.strip{background:var(--gold)}
.strip .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.strip div{display:flex;align-items:center;gap:14px;padding:24px 20px;font:800 1.35rem var(--cond);letter-spacing:.05em;text-transform:uppercase;color:var(--navy);border-right:2px solid rgba(6,27,63,.2)}
.strip div:last-child{border-right:0}
.strip svg{width:34px;height:34px;flex:none;fill:none;stroke:var(--navy);stroke-width:1.8;stroke-linecap:square;stroke-linejoin:miter}
.about{display:grid;grid-template-columns:.9fr 1.1fr;gap:72px;align-items:start}
.about p{color:#33445a}
.about p+p{margin-top:16px}
.about p:first-child{font-size:1.15rem;color:var(--ink);font-weight:500}
.vm{background:var(--concrete)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:0}
.panel{background:var(--grid),var(--navy);background-size:40px 40px,40px 40px,auto;color:#d1dcec;padding:56px 48px;position:relative}
.panel+.panel{background:var(--grid),var(--navy2);background-size:40px 40px,40px 40px,auto}
.panel::before{content:"";position:absolute;left:0;top:0;right:0;height:12px;background:var(--haz)}
.panel h3{color:var(--white);font-size:2.6rem;margin:10px 0 14px}
.values{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:34px}
.values div{background:var(--white);padding:30px 28px;border-left:8px solid var(--gold);box-shadow:0 2px 0 var(--line)}
.values dt{font:800 1.7rem var(--cond);text-transform:uppercase;color:var(--navy);margin-bottom:4px;letter-spacing:.02em}
.values dd{color:var(--mute);font-size:.98rem;line-height:1.55}
.services{background:var(--grid),var(--navy);background-size:56px 56px,56px 56px,auto;color:var(--white)}
.services h2{color:var(--white)}
.services .lead{color:#c5d2e4}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:52px}
.card{background:var(--navy2);border-top:6px solid var(--gold);padding:30px 24px 32px;transition:background .2s,transform .2s;min-height:200px}
.card:hover{background:var(--gold)}
.ic{width:60px;height:60px;background:var(--gold);display:grid;place-items:center;margin-bottom:22px;transition:background .2s}
.ic svg{width:32px;height:32px;fill:none;stroke:var(--navy);stroke-width:1.8;stroke-linecap:square;stroke-linejoin:miter}
.card h3{font-size:1.65rem;line-height:1.05;color:var(--white);transition:color .2s}
.card:hover h3{color:var(--navy)}
.card:hover .ic{background:var(--navy)}
.card:hover .ic svg{stroke:var(--gold)}
.contact{background:var(--concrete)}
.contact .cols{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;margin-top:48px}
.info{background:var(--navy);color:#d1dcec;padding:56px 36px 40px;position:relative;align-self:start}
.info::before{content:"";position:absolute;left:0;top:0;right:0;height:14px;background:var(--haz)}
.info h3{color:var(--white);font-size:2rem;margin-bottom:24px;line-height:1.05}
.info p{font:700 1rem var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.info a{display:block;font-weight:500;text-decoration:none;color:var(--white);word-break:break-all;margin-bottom:6px}
.info a:hover{color:var(--gold-l)}
.info .btn{margin-top:24px;text-align:center;display:block;padding:15px}
.info .btn.wa{background:var(--wa);border-color:var(--wa);color:var(--white)}
.info .btn.wa:hover{background:transparent;color:var(--white);border-color:var(--white)}
.formbox{background:var(--white);padding:40px;border-top:6px solid var(--gold)}
form{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.f{display:flex;flex-direction:column;gap:7px}
.f.full{grid-column:1/-1}
label{font:700 1.05rem var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--navy)}
label i{font-style:normal;font-weight:500;color:var(--mute);text-transform:none;letter-spacing:0;font-family:var(--sans);font-size:.85rem}
input,select,textarea{font:inherit;font-size:1rem;padding:14px 15px;border:2px solid #aeb9c7;background:var(--white);width:100%;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--navy);outline:3px solid rgba(224,164,23,.5)}
textarea{min-height:150px;resize:vertical}
.err{color:#b3261e;font-size:.85rem;display:none}
.f.bad .err{display:block}
.f.bad input,.f.bad select,.f.bad textarea{border-color:#b3261e}
.fbtn{grid-column:1/-1}
.fbtn .btn{width:100%;background:var(--navy);border-color:var(--navy);color:var(--white);font-size:1.3rem;padding:17px}
.fbtn .btn:hover{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.note{grid-column:1/-1;font-size:.9rem;color:var(--mute)}
.status{grid-column:1/-1;padding:16px 18px;background:#fff4d6;border-left:8px solid var(--gold);display:none;font-size:.95rem}
.status.show{display:block}
footer{background:var(--ink);color:#b3c2d8;padding:0 0 100px;font-size:.95rem}
footer .haz{margin-bottom:56px}
footer .row{display:flex;justify-content:space-between;gap:32px;flex-wrap:wrap;align-items:center}
footer .fl{background:var(--white);padding:12px 18px}
footer .fl img{height:70px;width:auto}
footer a{color:var(--white);text-decoration:none}
footer a:hover{color:var(--gold-l)}
footer .credit{margin-top:36px;padding-top:22px;border-top:1px solid rgba(255,255,255,.14);text-align:center;font-size:.9rem}
footer .credit a{color:var(--gold);font-weight:600}
.fab{position:fixed;right:20px;bottom:20px;z-index:60;width:64px;height:64px;background:var(--wa);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.4);border:3px solid var(--white)}
.fab:hover{background:#178a45}
.fab svg{width:34px;height:34px;fill:var(--white)}
</style>
</head>
